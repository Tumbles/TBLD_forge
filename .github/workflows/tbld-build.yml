name: TBLD build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Install virtual framebuffer
        run: command -v Xvfb >/dev/null 2>&1 || { sudo apt update && sudo apt install -y xvfb; }

      - name: Build desktop package and run TBLD tests
        run: |
          export DISPLAY=":1"
          Xvfb :1 -screen 0 800x600x8 &
          mvn -U -B -P windows-linux install -T 1C -Dtest='forge.tbld.*Test' -Dsurefire.failIfNoSpecifiedTests=false

      - name: Locate package
        id: pkg
        run: echo "dir=$(find forge-installer/target -maxdepth 1 -type d -name 'forge-installer-*' | head -1)" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Browser test (two tabs play a full game)
        run: |
          pkg="${{ steps.pkg.outputs.dir }}"
          jar=$(cd "$pkg" && ls forge-gui-desktop-*-jar-with-dependencies.jar | head -1)
          (cd "$pkg" && java -Dtbld.debug=true -jar "$jar" tbld 8090 > "$RUNNER_TEMP/server.log" 2>&1 &)
          cd tbld-e2e
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          for i in $(seq 1 180); do grep -q "TBLD server running" "$RUNNER_TEMP/server.log" && break; sleep 1; done
          if ! node play.mjs http://localhost:8090/; then
            echo "---- server log: seat 2 main phase prompts ----"
            grep "\[tbld\] seat 2" "$RUNNER_TEMP/server.log" | grep -B3 -A3 "Main phase" | tail -60
            echo "---- server log (last 40 lines) ----"
            tail -40 "$RUNNER_TEMP/server.log"
            exit 1
          fi

      - name: Upload browser test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tbld-browser-test
          path: tbld-e2e/out
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload desktop package
        uses: actions/upload-artifact@v4
        with:
          name: tbld-forge-desktop
          path: ${{ steps.pkg.outputs.dir }}
          retention-days: 14
