    const lo = remMin >= 0 ? remMin : 0, hi = remMax >= 0 ? remMax : total;
    box.dataset.need = String(Math.max(0, source.length - hi));
    const isCards = all.every(isCardRef);
    setTitle(title, a[6] && a[6].name ? "For " + a[6].name : "");
    ref(a[6]);
    const wrap = el("div", "piles2");
    const column = el("div");
    column.style.flex = "1";
    if (!pureOrder) column.append(el("div", "hint", "Click a card to move it to the other pile."));
    column.append(wrap);
    body.append(column);
    const need = el("div", "need");
    actions.append(need);
    const confirm = addButton(pureOrder ? "Done" : "Confirm", () => answer(right.slice()), true);
    const node = (i, inDest) => {
      const o = all[i];
      const n = isCards ? cardEl(asCard(o), null, { noClick: true }) : el("button", "btn", label(o));
      n.dataset.index = i;
      if (!pureOrder) {
        n.classList.add("opt");
        if (inDest) n.classList.add("picked");
        n.addEventListener("click", () => {
          if (inDest) { right = right.filter(x => x !== i); left.push(i); } else { left = left.filter(x => x !== i); right.push(i); }
          draw();
        });
      }
      if (inDest && right.length > 1) {
        const pos = right.indexOf(i);
        const btns = el("div", "order-btns");
        const move = (delta, e) => {
          e.stopPropagation();
          const j = pos + delta;
          if (j < 0 || j >= right.length) return;
          [right[pos], right[j]] = [right[j], right[pos]];
          draw();
        };
        const l = el("button", "", "◀"); l.title = "Earlier"; l.onclick = e => move(-1, e);
        const r = el("button", "", "▶"); r.title = "Later"; r.onclick = e => move(1, e);
        btns.append(l, r);
        n.append(btns);
      }
      return n;
    };
    const draw = () => {
      hidePreview();
      const boxes = [];
      if (!pureOrder) {
        const src = el("div", "pile-box");
        src.append(el("div", "zone-label", "Not chosen (" + left.length + ")"));
        const g = el("div", "choices");
        left.forEach(i => g.append(node(i, false)));
        src.append(g);
        boxes.push(src);
      }
      const dst = el("div", "pile-box dest");
      dst.append(el("div", "zone-label", caption + " (" + right.length + ")"));
      if (right.length > 1) {
        const ends = el("div", "ends");
        ends.append(el("span", "", "◀ first"), el("span", "", "last ▶"));
        dst.append(ends);
      }
      const g2 = el("div", "choices");
      right.forEach(i => g2.append(node(i, true)));
      dst.append(g2);
      boxes.push(dst);
      wrap.replaceChildren(...boxes);
      const ok = left.length >= lo && left.length <= hi;
      confirm.disabled = !ok;
      need.textContent = pureOrder ? "Put them in order" : (lo === hi ? "Choose " + (source.length - lo)
        : (remMin < 0 && remMax < 0 ? "Choose any number" : "Leave " + lo + " to " + hi + " unchosen"));
    };
    draw();
  }
}

document.getElementById("log-open").onclick = openLog;

// ------------------------------------------------------------------ target lines

const SVG_NS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs, text) {
  const e = document.createElementNS(SVG_NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  return e;
}
/** Where a target is shown: a player's name, a card on the battlefield, or a spell on the stack. */
function targetElement(t) {
  if (t.player !== undefined) return document.querySelector('.who[data-player-name="' + t.player + '"]');
  return document.querySelector('#half-me .card[data-id="' + t.card + '"], #half-opp .card[data-id="' + t.card + '"]')
    || document.querySelector('#stack .stack-item[data-source="' + t.card + '"]');
}
/**
 * Draws a curved line from each stack item to each of its targets, with the item's number (1 is the
 * top of the stack) in a ring at both ends.
 */
function drawArrows() {
  const svg = document.getElementById("arrows");
  const lines = [], badges = [];
  const stackBox = document.getElementById("stack").getBoundingClientRect();
  const items = state && !state.gameOver && state.stack ? state.stack : [];
  // Block lines: from the edge of each blocker that faces its attacker to the attacker's facing edge
  const battlefield = id => document.querySelector('#half-me .card[data-id="' + id + '"], #half-opp .card[data-id="' + id + '"]');
  for (const p of state && !state.gameOver && state.players ? state.players : []) {
    for (const c of Array.isArray(p.battlefield) ? p.battlefield : []) {
      for (const aid of c.blockingIds || []) {
        const b = battlefield(c.id), a = battlefield(aid);
        if (!b || !a) continue;
        const br = b.getBoundingClientRect(), ar = a.getBoundingClientRect();
        if (!br.width || !ar.width) continue;
        const below = br.top + br.height / 2 > ar.top + ar.height / 2;
        const sx = br.left + br.width / 2, sy = below ? br.top : br.bottom;
        const ex = ar.left + ar.width / 2, ey = below ? ar.bottom : ar.top;
        lines.push(svgEl("path", { class: "block", d: `M ${sx} ${sy} L ${ex} ${ey}`, "data-blocker": c.id, "data-attacker": aid }));
        badges.push(svgEl("circle", { class: "block", cx: sx, cy: sy, r: 4 }), svgEl("circle", { class: "block", cx: ex, cy: ey, r: 4 }));
      }
    }
  }
  items.forEach((s, i) => {
    const targets = [...(s.targetCards || []).map(card => ({ card })), ...(s.targetPlayers || []).map(player => ({ player }))];
    const item = targets.length ? document.querySelector('#stack .stack-item[data-stack="' + s.id + '"]') : null;
    if (!item) return;
    const r = item.getBoundingClientRect();
    // The line leaves the item's left edge, kept within the stack's visible area when it scrolls
    const sx = r.left + 4;
    const sy = Math.min(Math.max(r.top + 16, stackBox.top + 10), stackBox.bottom - 10);
    let drawn = false;
    for (const t of targets) {
      const target = targetElement(t);
      if (!target || target === item) continue;
      const tr = target.getBoundingClientRect();
      if (!tr.width) continue;
      // A card's ring sits at its top; a player's on their name
      const ex = tr.left + tr.width / 2;
      const ey = t.player !== undefined ? tr.top + tr.height / 2 : tr.top + 12;
      const dx = ex - sx, dy = ey - sy, len = Math.hypot(dx, dy) || 1;
      const bend = Math.min(90, len * .2);
      let nx = -dy / len, ny = dx / len;
      if (ny > 0) { nx = -nx; ny = -ny; }   // bow upward
      const cx = (sx + ex) / 2 + nx * bend, cy = (sy + ey) / 2 + ny * bend;
      lines.push(svgEl("path", { d: `M ${sx} ${sy} Q ${cx} ${cy} ${ex} ${ey}`, "data-stack": s.id }));
      badges.push(svgEl("circle", { cx: ex, cy: ey, r: 9, "data-end": "target" }), svgEl("text", { x: ex, y: ey }, String(i + 1)));
      drawn = true;
    }
    if (drawn) badges.push(svgEl("circle", { cx: sx, cy: sy, r: 9, "data-end": "stack" }), svgEl("text", { x: sx, y: sy }, String(i + 1)));
  });
  svg.replaceChildren(...lines, ...badges);
}
let arrowsQueued = false;
function queueArrows() {
  if (arrowsQueued) return;
  arrowsQueued = true;
  requestAnimationFrame(() => { arrowsQueued = false; drawArrows(); });
}
window.addEventListener("resize", queueArrows);
document.getElementById("stack").addEventListener("scroll", queueArrows);
// Anything that moves the board or the stack moves the lines
const arrowObserver = new ResizeObserver(queueArrows);
for (const id of ["decision", "stack", "half-me", "half-opp"]) {
  const e = document.getElementById(id);
  if (e) arrowObserver.observe(e);
}

document.getElementById("restart").onclick = () => {
  if (window.confirm("Abandon this game and start a new one?")) send({ t: "restart" });
};
buildPhaseBar();
renderPhaseBar();
if (seat) connect();
</script>
